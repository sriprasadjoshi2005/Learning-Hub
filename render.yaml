services:
  - type: web
    name: learning-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      # Connection string of your free Neon (Postgres) database. Progress is stored there,
      # so it survives restarts and redeploys. See DATABASE_SETUP.md.
      - key: DATABASE_URL
        sync: false
